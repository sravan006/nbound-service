server:
  port: ${INBOUND_RECEIVER_HTTP_PORT:8081}

spring:
  application:
    name: rxlink-inbound-tcp-receiver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# CD: 7001 Relay Health, 7002 Change Health — same image, different port + source-channel
inbound:
  receiver:
    service-name: ${SERVICE_NAME:rxlink-inbound-receiver-7001}
    tcp:
      port: ${INBOUND_TCP_PORT:7001}
      max-message-size: 1048576
      max-connections: 500
    source-channel: ${INBOUND_SOURCE_CHANNEL:RELAY_HEALTH}
    router:
      base-url: ${INBOUND_ROUTER_URL:http://localhost:8080}
      connect-timeout-ms: 5000
      read-timeout-ms: 120000
      route-path: /api/v1/route
    correlation:
      ttl-seconds: 86400
    cache:
      ttl-seconds: 300

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
